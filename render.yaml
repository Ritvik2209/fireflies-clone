# Render Blueprint for the backend: the service is defined here, so deploys are reproducible.
# Render re-applies this file on every push to main. Spec: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: glowworm-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # The free instance's disk is ephemeral: the database is recreated and re-seeded on each start.
      - key: DATABASE_URL
        value: sqlite:///./app.db
      # Comma-separated browser origins allowed to call the API: the Vercel production URL.
      # (Local development uses the localhost defaults in app/config.py instead.)
      - key: CORS_ORIGINS
        value: https://glowworm-plum.vercel.app
      # Bonus 6 chat (Groq through the OpenAI SDK). The provider and model are plain settings.
      # The key is a secret: sync: false means it's entered in the Render dashboard only, and
      # never appears in this file. Without it, the chat answers with search results.
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: LLM_API_KEY
        sync: false
