# Render Blueprint for the backend: the service is defined here, so deploys are reproducible.
# Render re-applies this file on every push to main. Spec: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: glowworm-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # The free instance's disk is ephemeral: the database is recreated and re-seeded on each start.
      - key: DATABASE_URL
        value: sqlite:///./app.db
      # Comma-separated browser origins allowed to call the API (the Vercel URL is added once known).
      - key: CORS_ORIGINS
        value: http://localhost:3000,http://localhost:3001
